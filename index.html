<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. | Neural AI & Voice Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  
  <div class="hologram-background"></div>
  <div class="scanlines"></div>

  <div class="app">
    
    <!-- Top HUD Bar -->
    <header class="app-header">
      <div class="hud-top-left">
        <span class="hud-tag"><i class="fa-solid fa-microchip"></i> MARK VII</span>
        <span class="hud-tag" id="systemArch"><i class="fa-solid fa-server"></i> ONLINE</span>
      </div>

      <!-- Arc Reactor Canvas Core -->
      <div class="orb-container" id="orbContainer" title="Click to test reactor pulse">
        <canvas id="arcCanvas" width="130" height="130"></canvas>
        <div class="core-glow"></div>
      </div>

      <div class="header-title-box">
        <h1 class="glitch" data-text="J.A.R.V.I.S.">J.A.R.V.I.S.</h1>
        <p class="subtitle">Neural Interface & Voice Telemetry System</p>
      </div>

      <div class="hud-top-right">
        <button id="soundToggleBtn" class="hud-icon-btn" title="Toggle Sound Effects">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button id="settingsBtn" class="hud-icon-btn" title="Voice & System Settings">
          <i class="fa-solid fa-gear"></i>
        </button>
        <button id="clearChatBtn" class="hud-icon-btn" title="Clear Dialogue Buffer">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </header>

    <!-- Voice & Audio Settings Drawer (Collapsible) -->
    <div class="settings-drawer" id="settingsDrawer">
      <div class="settings-grid">
        <div class="setting-item">
          <label for="voiceSelect"><i class="fa-solid fa-headset"></i> Voice Persona</label>
          <select id="voiceSelect" class="hud-select">
            <option value="">Auto-Detect British/English</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="rateSlider"><i class="fa-solid fa-gauge-high"></i> Speed: <span id="rateVal">1.0x</span></label>
          <input type="range" id="rateSlider" min="0.7" max="1.4" step="0.05" value="1.0" class="hud-slider" />
        </div>
        <div class="setting-item">
          <label for="pitchSlider"><i class="fa-solid fa-sliders"></i> Pitch: <span id="pitchVal">1.0</span></label>
          <input type="range" id="pitchSlider" min="0.7" max="1.3" step="0.05" value="1.0" class="hud-slider" />
        </div>
      </div>
    </div>

    <!-- Quick Skill Command Chips -->
    <div class="quick-chips-bar">
      <button class="chip" data-cmd="What is the weather in Tokyo?">🌤️ Tokyo Weather</button>
      <button class="chip" data-cmd="Run system diagnostics">⚡ Diagnostics</button>
      <button class="chip" data-cmd="Who was Nikola Tesla?">📚 Nikola Tesla</button>
      <button class="chip" data-cmd="Open YouTube and search interstellar soundtrack">🎵 Interstellar OST</button>
      <button class="chip" data-cmd="Tell me a joke">😂 Tell Joke</button>
      <button class="chip" data-cmd="Calculate 256 * 48">🧮 256 * 48</button>
    </div>

    <!-- Scrollable Chat Stream -->
    <main class="chat-window" id="chatWindow">
      <div class="message jarvis">
        <div class="message-header">
          <span class="label"><i class="fa-solid fa-shield-halved"></i> J.A.R.V.I.S.</span>
          <span class="timestamp">00:00</span>
        </div>
        <div class="message-content">
          <p>Good day, Sir. All quantum heuristics and neural subroutines are online. You may speak with me via microphone or type your directives below.</p>
        </div>
      </div>
    </main>

    <!-- Bottom HUD Input Bar -->
    <footer class="input-bar">
      <button id="micBtn" class="mic-btn" title="Click to Speak (Web Speech API)">
        <i class="fa-solid fa-microphone"></i>
        <span class="mic-pulse"></span>
      </button>

      <div class="input-wrapper">
        <input 
          id="textInput" 
          type="text" 
          placeholder="State your directive or inquiry, Sir..." 
          autocomplete="off" 
        />
        <div class="input-border-glow"></div>
      </div>

      <button id="sendBtn" class="send-btn" title="Execute Directive">
        <span>TRANSMIT</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </footer>

    <!-- HUD Status Footer -->
    <div class="status-bar" id="statusBar">
      <div class="status-indicator online"></div>
      <span id="statusText">SYSTEM IDLE • READY FOR INPUT</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
